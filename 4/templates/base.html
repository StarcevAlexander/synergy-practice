<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Турагентство{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f7fa; color: #1a2233; }
    header { background: #1565c0; color: #fff; padding: 16px 24px; }
    header a { color: #fff; margin-right: 16px; text-decoration: none; }
    main { max-width: 880px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 10px; padding: 16px 20px; margin-bottom: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .price { font-weight: 700; color: #1565c0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e3e8ef; }
    input { padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
    button { background: #1565c0; color: #fff; border: 0; padding: 10px 18px;
             border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <a href="{{ url_for('index') }}">Каталог туров</a>
    <a href="{{ url_for('requests_list') }}">Заявки</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
